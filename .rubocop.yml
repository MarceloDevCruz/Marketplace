inherit_from: .rubocop_todo.yml

# Omakase Ruby styling for Rails
inherit_gem: { rubocop-rails-omakase: rubocop.yml }

plugins:
  - rubocop-rspec

Layout/LineLength:
  Max: 120
  Enabled: true

AllCops:
  NewCops: enable
  Exclude:
    - 'spec/rails_helper.rb'
    - 'spec/spec_helper.rb'
    - 'db/migrate/20251109150424_create_friendly_id_slugs.rb'

Lint/Debugger:
  Enabled: true

Style/StringLiterals:
  EnforcedStyle: double_quotes
  Enabled: true

Rspec/MessageSpies:
  Enabled: false